name = "wind_rejection"
description = "Drone hovers despite wind disturbance"
duration_s = 10.0
dt_s = 0.005

target_z = 5.0

[initial]
position = [0.0, 0.0, 5.0]
velocity  = [0.0, 0.0, 0.0]

[[disturbances]]
at_s  = 3.0
force = [0.0, 0.0, -2.0]

[[assertions]]
metric = "position_rms_z"
max = 0.3

[[assertions]]
metric = "position_max_error_z"
max = 1.0

[[assertions]]
metric = "settling_time_s"
max = 7.0
