# MPC controller configuration
# Prediction horizon = 10 steps × dt_s = 5.0 s lookahead
type = "mpc"
horizon = 10
dt_s = 0.5    # MPC prediction step (deliberately coarser than simulation dt)

# State cost weights (13 elements):
# [x, y, z, vx, vy, vz, ωx, ωy, ωz, qi, qj, qk, qw]
# Higher z weight → tighter altitude hold; low xy weights avoid attitude instability
q_weights = [15.0, 15.0, 50.0,  2.0, 2.0, 8.0,  4.0, 4.0, 4.0,  15.0, 15.0, 15.0, 15.0]

# Control cost weights (4 motors)
# Smaller values → more aggressive / faster response
r_weights = [0.01, 0.01, 0.01, 0.01]

# Integral cost weights (3 elements: ξ_x, ξ_y, ξ_z)
# Corrects steady-state offset from motor lag mismatch
qi_weights = [1.0, 1.0, 3.0]

# Anti-windup clamp for integrals [m·s]
xi_limits = [3.0, 3.0, 3.0]
