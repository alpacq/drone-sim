name = "turbulence_rejection"
description = "Dron retains altitude during turbulence"
duration_s = 15.0
dt_s = 0.005

[target]
z = 5.0

[initial]
position = [0.0, 0.0, 5.0]

[[disturbances]]
type = "turbulence"
start_s = 3.0
end_s = 10.0
# z_only=true: tests altitude rejection specifically.
# XY turbulence causes XY→Z coupling instability unrelated to altitude control.
intensity_n = 0.5
z_only = true
seed = 42

[[assertions]]
metric = { position_rms_axis = "z" }
max = 0.5

[[assertions]]
metric = "settling_time_s"
max = 12.0
