name = "wind_rejection"
description = "Drone hovers despite wind disturbance"
duration_s = 10.0
dt_s = 0.005

[target]
z = 5.0

[initial]
position = [0.0, 0.0, 5.0]
velocity  = [0.0, 0.0, 0.0]

[[disturbances]]
type = "wind_gust"
at_s = 3.0
duration_s = 0.2
force = [0.0, 0.0, -2.0]

[[assertions]]
metric = { position_rms_axis = "z" }
max = 0.3

[[assertions]]
metric = { position_max_error_axis = "z" }
max = 1.0

[[assertions]]
metric = "settling_time_s"
max = 7.0
